<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spider Verse | AadarshM</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#000000,#001f4d,#8b0000);
color:white;
text-align:center;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}

.hero h1{
font-size:50px;
color:#ff2b2b;
text-shadow:0 0 20px red;
animation:glow 2s infinite;
}

.hero h2{
margin-top:15px;
font-size:25px;
}

.hero p{
margin-top:10px;
font-size:18px;
}

@keyframes glow{
50%{
text-shadow:0 0 40px red;
}
}

.gallery{
padding:50px 20px;
}

.gallery h2{
margin-bottom:25px;
font-size:35px;
}

.card{
display:inline-block;
margin:15px;
padding:15px;
background:rgba(255,255,255,0.08);
border-radius:20px;
}

.card img{
width:320px;
max-width:90vw;
border-radius:15px;
}

.btn{
display:inline-block;
margin-top:10px;
padding:10px 20px;
background:red;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

footer{
padding:30px;
font-size:18px;
}
</style>
</head>
<body>

<section class="hero">

</div>

<div class="card">
